<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      window.sodium = {
        onload: function (sodium) {
          let h = sodium.crypto_generichash(
            64,
            sodium.from_string("sodium_loaded"),
          );
          console.log(sodium.to_hex(h));
        },
      };
    </script>
    <script src="sodium.js" async></script>
  </head>
  <body>
    <div class="auth-forms">
      <form class="register-form" id="reg_form">
        <h1>Register</h1>
        <input type="text" name="name" id="reg_name" placeholder="Full Name" />
        <input
          type="text"
          name="username"
          id="reg_username"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          id="reg_password"
          placeholder="Password"
        />
        <input id="reg_submit" type="submit" value="Register" />
        <pre id="reg_form_output" class="form-response-output"></pre>
      </form>
      <hr />
      <form class="login-form" id="login_form">
        <h1>Login</h1>
        <input
          type="text"
          name="username"
          id="login_username"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          id="login_password"
          placeholder="Password"
        />
        <input id="login_submit" type="submit" value="Login" />
        <pre id="login_form_output" class="form-response-output"></pre>
      </form>
    </div>
  </body>
  <script src="script.js"></script>
</html>
